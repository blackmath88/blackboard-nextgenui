<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLI Pilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <section class="pane term" aria-label="Terminal">
    <div class="bar"><span id="brand">pilot</span><small id="meta">connecting…</small></div>
    <div class="body" id="log" role="log" aria-live="polite"></div>
    <form class="prompt" id="form" autocomplete="off">
      <label for="input">&gt;</label>
      <input id="input" name="text" spellcheck="false" placeholder="Type a message and press Enter" autofocus>
    </form>
  </section>
  <footer class="status" id="status"><span id="models" aria-label="Active model per role">models…</span><span id="count"></span></footer>
</main>
<script src="pixel.js"></script>
<script src="app.js"></script>
</body>
</html>
