<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLI Pilot</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell" id="shell">
 <nav class="chats" id="chats" aria-label="Chats" hidden>
  <div class="bar"><span id="chats-label">chats</span><button type="button" class="why" id="chats-close" aria-label="close the chat list">close</button></div>
  <div class="chats-body">
   <button type="button" class="key new-chat new-project" id="new-project" title="/project new <name>" hidden><kbd>+</kbd> new project</button>
   <div class="projects" id="project-list" hidden></div>
   <button type="button" class="key new-chat" id="new-chat" title="/chat new"><kbd>+</kbd> new chat</button>
   <ul class="chat-list" id="chat-list"></ul>
   <button type="button" class="toggle" id="archived-toggle" aria-expanded="false" hidden></button>
   <ul class="chat-list archived" id="chat-archived" hidden></ul>
   <button type="button" class="toggle" id="archived-projects-toggle" aria-expanded="false" hidden></button>
   <ul class="chat-list archived" id="project-archived" hidden></ul>
   <p class="chats-help" id="chats-help">Alt+S here, ↑/↓, Enter; Esc back</p>
  </div>
 </nav>
 <div class="bench n1" id="bench">
  <section class="pane term" id="pane-chat" aria-label="Terminal">
    <div class="bar"><div class="lead"><button type="button" class="why chats-btn" id="chats-btn" aria-controls="chats" aria-expanded="false" aria-label="chats" title="chats (Alt+S)">☰</button><span id="brand">pilot</span><small id="chat-name"></small></div><small id="meta">connecting…</small></div>
    <p class="notice" id="notice" role="status" hidden></p>
    <div class="body" id="log" role="log" aria-live="polite"></div>
    <form class="prompt" id="form" autocomplete="off">
      <label for="input">&gt;</label>
      <input id="input" name="text" spellcheck="false" placeholder="Type a message and press Enter" autofocus>
    </form>
  </section>
 </div>
  <p class="sr-only" id="announce" role="status" aria-live="polite"></p>
  <p class="sr-only" id="kb-help">Drag to move. With the card focused: Alt+Left or Alt+Right moves it to the previous or next column, Alt+Up or Alt+Down moves it up or down.</p>
  <footer class="status" id="status"><span id="models" aria-label="Active model per role">models…</span><span id="count"></span></footer>
</main>
<script src="pixel.js"></script>
<script src="settle.js"></script>
<script src="board.js"></script>
<script src="app.js"></script>
</body>
</html>
